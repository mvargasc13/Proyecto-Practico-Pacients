{% extends "paciente/base.html" %}
{% load static %}
{% block content %}
<h1>Eliminar Receta Médica</h1>
<p>¿Seguro que deseas eliminar esta receta médica?</p>
<div class="alert alert-warning alert-dismissible fade show" role="alert">
  <strong>⚠️ Advertencia:</strong> Esta acción no se puede deshacer. Se eliminará permanentemente el registro de la receta.
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form method="post" id="formEliminar" name="formEliminar">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger" id="btnEliminar">Sí, eliminar</button>
  <a class="btn btn-secondary" href="{% url 'student:listar_recetas' %}">Cancelar</a>
</form>

<script src="{% static 'js/validaciones.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    inicializarConfirmacionEliminacion('formEliminar');
  });
</script>
{% endblock %}
