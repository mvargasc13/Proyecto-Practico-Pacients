{% extends "paciente/base.html" %}
{% load static %}
{% block content %}
<h1>Editar: {{ especialidad.nombre }}</h1>

<!-- Contenedor para mensajes de error -->
<div id="errorMessages" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
  <strong>Por favor, corrige los siguientes errores:</strong>
  <ul id="errorList" class="mb-0 mt-2"></ul>
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form method="post" class="card card-body" id="formEspecialidad" name="formEspecialidad">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary" id="btnActualizar">Actualizar</button>
  <a class="btn btn-secondary" href="{% url 'student:listar_especialidades' %}">Volver</a>
</form>

<script src="{% static 'js/validaciones.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    inicializarValidaciones('formEspecialidad');
  });
</script>

<style>
.is-invalid {
  border-color: #dc3545 !important;
  background-color: #fff5f5;
}
</style>
{% endblock %}
