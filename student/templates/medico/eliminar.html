{% extends 'paciente/base.html' %}
{% block content %}
<div class="container mt-5">
  <div class="card">
    <div class="card-header bg-danger text-white">
      <h4>Eliminar Médico</h4>
    </div>
    <div class="card-body">
      <form method="post" id="deleteForm">
        {% csrf_token %}
        <p>¿Estás seguro de que deseas eliminar a <strong>{{ medico.nombre }} {{ medico.apellido }}</strong>?</p>
        <button type="submit" class="btn btn-danger">Sí, eliminar</button>
        <a class="btn btn-secondary" href="{% url 'student:listar_medicos' %}">Cancelar</a>
      </form>
    </div>
  </div>
  {% if messages %}
    <div class="mt-3">
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
</div>
<script>
  document.getElementById('deleteForm').addEventListener('submit', function(event) {
    if(!confirm('¿Estás seguro de que deseas eliminar a {{ medico.nombre }} {{ medico.apellido }}?')) {
      event.preventDefault();
    }
  });
</script>
{% endblock %}
