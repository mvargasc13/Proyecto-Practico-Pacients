{% extends "paciente/base.html" %}
{% load static %}
{% block content %}
<h1>Nuevo Paciente</h1>
<p>Completa el siguiente formulario para registrar un nuevo paciente.</p>

<!-- Contenedor para mensajes de error -->
<div id="errorMessages" class="alert alert-danger alert-dismissible fade show d-none" role="alert">
  <strong>Por favor, corrige los siguientes errores:</strong>
  <ul id="errorList" class="mb-0 mt-2"></ul>
  <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<form method="post" class="card card-body" id="formPaciente" name="formPaciente">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success" id="btnGuardar">Guardar</button>
  <a class="btn btn-secondary" href="{% url 'student:listar_pacientes' %}">Volver</a>
</form>

<script src="{% static 'js/validaciones.js' %}"></script>
<script>
  document.addEventListener('DOMContentLoaded', function() {
    inicializarValidaciones('formPaciente');
  });
</script>

<style>
.is-invalid {
  border-color: #dc3545 !important;
  background-color: #fff5f5;
}
</style>
{% endblock %}
