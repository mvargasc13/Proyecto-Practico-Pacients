<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>StudentHub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap opcional para estilos rápidos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'student:inicio' %}">PacienteHub</a>
    
    <div class="d-flex align-items-center">
      <span class="navbar-text text-light me-3">
        Bienvenido, {{ user.first_name }}
      </span>
      <a class="btn btn-sm btn-outline-light me-2" href="{% url 'student:inicio' %}">Inicio</a>
      <a class="btn btn-sm btn-outline-danger" href="{% url 'student:logout' %}">Cerrar Sesión</a>
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
